<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Gradientes de Ondas e Fluídos -->
    <linearGradient id="fluidGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8f01b" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#73aa0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#080a0e" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="fluidGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8f01b" stop-opacity="0.30" />
      <stop offset="60%" stop-color="#2a3d0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#080a0e" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="65%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#b8f01b" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#b8f01b" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#080a0e" stop-opacity="0" />
    </radialGradient>

    <!-- Filtro de Blur para Fluído Orgânico -->
    <filter id="fluidBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="85" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="110" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#080a0e" />

  <!-- Grande Esfera Fluída de Iluminação de Fundo -->
  <circle cx="1250" cy="420" r="480" fill="url(#centerGlow)" filter="url(#softGlow)" />

  <!-- Camadas Fluídas Orgânicas (Morphing Waves) -->
  <g filter="url(#fluidBlur)">
    <!-- Onda Fluída 1: Superior Direita -->
    <path d="M 850,-100 
             C 1200,80 1550,-50 1750,150 
             C 1950,350 1800,650 1600,750 
             C 1400,850 1150,700 950,550 
             C 750,400 600,200 700,50 
             Z" 
          fill="url(#fluidGrad1)" />

    <!-- Onda Fluída 2: Inferior Central -->
    <path d="M 1100,300 
             C 1450,250 1700,450 1900,600 
             C 2100,750 1750,1050 1400,1100 
             C 1050,1150 850,950 900,750 
             C 950,550 800,350 1100,300 
             Z" 
          fill="url(#fluidGrad2)" />

    <!-- Onda Fluída 3: Flutuador Central Refinado -->
    <path d="M 1200,200 
             C 1500,280 1650,500 1500,680 
             C 1350,860 1100,850 980,700 
             C 860,550 1000,300 1200,200 
             Z" 
          fill="rgba(184, 240, 27, 0.28)" />
  </g>

  <!-- Linhas Fluídas Elegantes de Contorno e Ondulações -->
  <g opacity="0.35">
    <path d="M 600,-50 Q 1100,300 1550,220 T 2050,800" 
          fill="none" stroke="#b8f01b" stroke-width="2.5" />
    <path d="M 750,50 Q 1200,420 1650,320 T 2150,920" 
          fill="none" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5" />
    <path d="M 500,150 Q 1000,550 1500,450 T 1950,1050" 
          fill="none" stroke="#b8f01b" stroke-width="1" stroke-dasharray="8,8" />
  </g>
</svg>
